# Telegraf: Docker API'sinden (docker stats ile aynı kaynak) container CPU/RAM/network
# bilgisini okur ve Prometheus'un çekebileceği formatta :9273/metrics üzerinden sunar.
# Docker Desktop'ın containerd image store'u cAdvisor ile uyumsuz olduğu için tercih edildi.

[agent]
  interval = "15s"
  round_interval = true
  flush_interval = "15s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  timeout = "10s"
  # CPU için container başına tek toplam seri; network ve blkio zaten toplam olarak gelir.
  perdevice_include = []
  total_include = ["cpu", "network", "blkio"]
  # Compose servis adını etiket olarak ekle (docker_container_*{com_docker_compose_service="api"}).
  docker_label_include = ["com.docker.compose.service"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]
